<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ESCAPE ROOM - FINAL TANPA TIMER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#hud{padding:10px;text-align:center;border-bottom:1px solid red}
#hud h1{font-size:15px;color:red}
#hud p{font-size:12px}
#game{position:relative;width:100vw;height:calc(100vh - 70px);overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hot{position:absolute;border:2px dashed yellow;background:rgba(255,255,0,.15);border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:11px;font-weight:bold;text-shadow:0 0 5px #000;z-index:10;cursor:pointer}
.hot.done{border-color:#0f0;background:rgba(0,255,0,.2)}
#hLemari{left:3%;top:8%;width:22%;height:78%}
#hCermin{left:28%;top:18%;width:18%;height:62%}
#hPintu{left:48%;top:22%;width:15%;height:58%}
#hKasur{left:68%;top:55%;width:30%;height:40%}
#hMeja{left:58%;top:68%;width:12%;height:25%}
#hJendela{left:66%;top:8%;width:26%;height:42%}
#pesan{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:13px;z-index:20;display:none;text-align:center;max-width:92%}
#invent{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:8px 12px;border-radius:20px;font-size:12px;z-index:20;border:1px solid #fff;text-align:center}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#box{background:#fff;color:#000;padding:20px;border-radius:15px;max-width:420px;width:100%;text-align:center}
#box h2{margin-bottom:10px}
#box p{font-size:14px;line-height:1.6;margin-bottom:12px}
#box input{width:100%;padding:10px;border:2px solid #000;border-radius:10px;text-align:center;font-size:18px;font-weight:bold;margin-bottom:10px}
#box button{padding:10px 18px;background:red;color:#fff;border:none;border-radius:10px;font-weight:bold;margin:3px}
#box .pilihan{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#box .pilihan button{background:#222;font-size:20px;padding:10px}
#pocong{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:90px;z-index:30;display:none;text-align:center}
#btnPanah{position:absolute;right:15px;bottom:50px;width:70px;height:70px;border-radius:50%;background:#ff6600;border:3px solid #fff;color:#fff;font-size:30px;z-index:40;display:none}
</style>
</head>
<body>
<div id="hud"><h1>☠️ ESCAPE ROOM - FINAL, TANPA TIMER ☠️</h1><p>Mikir santai! Salah = Pocong! Gak ada timer!</p></div>
<div id="game">
<img id="bg" src="kamar.jpg">
<div id="pesan"></div>
<div id="pocong">👻<br><span style="background:red;color:#fff;font-size:13px;padding:4px 10px;border-radius:10px">POCONG! TEMBAK!</span></div>
<div class="hot" id="hLemari">🗄️ LEMARI - 7391</div>
<div class="hot" id="hCermin">🪞 CERMIN - KATA</div>
<div class="hot" id="hPintu">🚪 PINTU - TANPA TIMER</div>
<div class="hot" id="hKasur">🛏️ KASUR - 5 BONEKA</div>
<div class="hot" id="hMeja">🕯️ MEJA - PANAH + PETUNJUK</div>
<div class="hot" id="hJendela">🌙 JENDELA - HITUNG</div>
<button id="btnPanah">🏹</button>
<div id="invent">🎒 Kosong</div>
</div>
<div id="popup"><div id="box"><h2 id="pJudul"></h2><p id="pIsi"></p><div id="pExtra"></div><button onclick="tutup()">OKE</button></div></div>
<script>
let kunci=false,kode=false,boneka=false,panah=false,anakPanah=0,pintuStep=0,jendela=false,cermin=false,sudah={kunci:0,kode:0,boneka:0,panah:0},lock=false,pocongHidup=false,menang=false,cdPanah=false;
let pesanEl=document.getElementById('pesan'),invent=document.getElementById('invent'),pocongEl=document.getElementById('pocong'),btnPanah=document.getElementById('btnPanah');
function tampil(t){pesanEl.innerText=t;pesanEl.style.display='block';setTimeout(()=>pesanEl.style.display='none',2800);}
function popup(j,i,ex){document.getElementById('pJudul').innerText=j;document.getElementById('pIsi').innerText=i;document.getElementById('pExtra').innerHTML=ex||'';document.getElementById('popup').style.display='flex';}
function tutup(){document.getElementById('popup').style.display='none';}
function spam(){if(lock)return true;lock=true;setTimeout(()=>lock=false,800);return false;}
function update(){invent.innerText=`🎒 ${kunci?'🔑Kunci ':''}${kode?'🔢Kode 3713 ':''}${boneka?'🎎Boneka ':''}${panah?'🏹Panah ':''}🏹 ${anakPanah} | Pintu ${pintuStep}/3`;}
function pocong(alasan){if(pocongHidup||menang)return;pocongHidup=true;pocongEl.style.display='block';btnPanah.style.display='block';tampil('💀 POCONG! '+alasan+' Tembak!');setTimeout(()=>{if(pocongHidup){pocongHidup=false;pocongEl.style.display='none';btnPanah.style.display='none';pintuStep=0;tampil('💀 DITANGKEP! Pintu ngulang dari awal!');}},8000);}
btnPanah.onclick=()=>{if(!pocongHidup||cdPanah)return;if(!panah){tampil('⛔ Belum punya PANAH! Cek KASUR!');return;}if(anakPanah<=0){tampil('⛔ ANAK PANAH HABIS! Cek MEJA!');return;}cdPanah=true;anakPanah--;tampil('🏹 DOR! Kena! Sisa '+anakPanah);setTimeout(()=>{pocongHidup=false;pocongEl.style.display='none';btnPanah.style.display='none';tampil('🎉 Pocong kabur!');},800);setTimeout(()=>cdPanah=false,2000);update();};
// 1. JENDELA - HITUNG, GAK NGASIH KODE LANGSUNG
document.getElementById('hJendela').onclick=()=>{if(spam())return;if(!jendela){jendela=true;popup('🌙 JENDELA','Lihat luar: Bulan ada 3, Bintang ada 2, Lilin di meja ada 1. Rumus: (Bulan x Bintang) + Lilin = Angka pertama. Angka lengkapnya? Cek di bawah kasur? Bukan. Cek di MEJA, ada kertas petunjuk!');}else popup('🌙 JENDELA','Bulan 3, Bintang 2, Lilin 1. (3x2)+1 = 7. Angka pertama 7!');update();};
// MEJA - CUMA PETUNJUK, GAK BOCORIN KODE
document.getElementById('hMeja').onclick=()=>{if(spam())return;if(anakPanah>=5){tampil('⛔ Anak panah max 5!');return;}anakPanah=5;popup('🕯️ MEJA','Dapet 5 ANAK PANAH! + Kertas petunjuk: Kode lemari itu 4 angka. Angka pertama dari JENDELA. 3 angka belakangnya dari jumlah paku di pintu lemari: 391. Gabungin sendiri!');update();};
// LEMARI
document.getElementById('hLemari').onclick=()=>{if(spam())return;if(sudah.kunci){tampil('⛔ ANTI DUPE! Kunci udah diambil!');return;}if(!jendela){popup('🗄️ TERKUNCI','Cek JENDELA + MEJA dulu!');return;}popup('🗄️ GEMBOK 4 ANGKA','Angka pertama dari JENDELA, 3 angka belakang dari MEJA. Jadi?','<input id="inL" placeholder="????"><br><button onclick="cekL()">BUKA</button>');};
function cekL(){let v=document.getElementById('inL').value;if(v=='7391'){sudah.kunci=1;kunci=true;document.getElementById('hLemari').classList.add('done');tutup();popup('🎉 BENER!','7391! Dapet KUNCI!');}else{tutup();pocong('Kode lemari salah!');}update();}
// CERMIN
document.getElementById('hCermin').onclick=()=>{if(spam())return;if(sudah.kode){tampil('⛔ ANTI DUPE! Kode udah didapet!');return;}if(!cermin){cermin=true;popup('🪞 CERMIN','Gosok cermin... Muncul kata: TIGA-TUJUH-SATU-TIGA. Ubah kata jadi angka! TIGA=3, TUJUH=7, SATU=1. Jadi kode pintu berapa?','<input id="inC" placeholder="Kata jadi angka"><br><button onclick="cekC()">JAWAB</button>');}else{popup('🪞 CERMIN','Kata nya: TIGA-TUJUH-SATU-TIGA. Jadi angka?','<input id="inC" placeholder="????"><br><button onclick="cekC()">JAWAB</button>');}update();};
function cekC(){let v=document.getElementById('inC').value;if(v=='3713'){sudah.kode=1;kode=true;document.getElementById('hCermin').classList.add('done');tutup();popup('🎉 BENER!','TIGA(3)-TUJUH(7)-SATU(1)-TIGA(3) = 3713! Itu kode pintu!');}else{tutup();pocong('Kode cermin salah!');}update();}
// KASUR
document.getElementById('hKasur').onclick=()=>{if(spam())return;if(panah&&boneka){tampil('⛔ Udah diambil semua!');return;}popup('🛏️ KASUR','Panah di bawah kasur. Boneka ada 5. Tebak-tebakan: Aku tidak punya mata, tapi aku melihatmu. Aku tidak punya mulut, tapi aku memanggilmu. Aku yang paling kecil, tapi aku yang paling asli. Yang mana?','<button onclick="ambilP()">🏹 AMBIL PANAH</button><br><div class="pilihan"><button onclick="cekB(1)">🎎 Paling Gede</button><button onclick="cekB(2)">🎎 Mata Merah</button><button onclick="cekB(3)">🎎 Paling Kecil</button><button onclick="cekB(4)">🎎 Mata Biru</button><button onclick="cekB(5)">🎎 Paling Jelek</button></div>');};
function ambilP(){if(sudah.panah){tutup();tampil('⛔ Panah udah diambil!');return;}sudah.panah=1;panah=true;tutup();popup('🏹 DAPET PANAH!','Buat tembak pocong!');update();}
function cekB(p){if(p==3){sudah.boneka=1;boneka=true;document.getElementById('hKasur').classList.add('done');tutup();popup('🎉 BENER!','Yang paling kecil itu yang asli!');}else{tutup();pocong('Salah pilih boneka!');}update();}
// PINTU - TANPA TIMER, SANTAI!
document.getElementById('hPintu').onclick=()=>{
  if(spam())return;if(menang){tampil('⛔ Udah menang!');return;}
  if(pintuStep==0){if(!kunci){popup('🚪 PINTU','Butuh KUNCI! Buka LEMARI!');return;}pintuStep=1;popup('🚪 LANGKAH 1 OK! TANPA TIMER, SANTAI!','Masukin kode pintu! Kode dari CERMIN: TIGA-TUJUH-SATU-TIGA. Mikir santai, gak ada timer!','<input id="inP" placeholder="????"><br><button onclick="cekP()">MASUKIN</button>');}
  else if(pintuStep==1){popup('🚪 KODE PINTU','Santai, gak ada timer!','<input id="inP" placeholder="????"><br><button onclick="cekP()">MASUKIN</button>');}
  else if(pintuStep==2){if(!boneka){popup('🚪 PINTU','Butuh BONEKA ASLI! Yang paling kecil!');return;}popup('🚪 TERAKHIR!','Taro boneka?','<button onclick="menangG()">TARO + KABUR!</button>');}
};
function cekP(){let v=document.getElementById('inP').value;if(v=='3713'){pintuStep=2;tutup();popup('🎉 KODE BENER!','Sekarang taro boneka!');}else{pintuStep=0;tutup();pocong('Kode pintu salah!');}update();}
function menangG(){menang=true;tutup();popup('🎉 MENANG! SEMPURNA! TANPA TIMER!','Lu berhasil! Kode lemari 7391 + Kode pintu 3713 + Boneka paling kecil! Urutan bener! Tanpa timer, santai tapi tetep susah!');document.getElementById('hPintu').classList.add('done');update();}
update();tampil('FINAL! Tanpa timer! Mulai: JENDELA -> MEJA -> LEMARI -> CERMIN -> KASUR -> PINTU!');
</script>
</body>
</html>
